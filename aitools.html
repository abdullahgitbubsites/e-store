<!DOCTYPE html>
<html lang="en">

<head>
<link  rel="icon" type="image/png" href="logo1.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Tools | Abdullah's Store</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#050505;
color:white;
overflow-x:hidden;
}

.glass{
background:rgba(255,255,255,.04);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.08);
}

::-webkit-scrollbar{
width:8px;
}

::-webkit-scrollbar-thumb{
background:white;
border-radius:20px;
}

</style>

</head>

<body>

<nav class="fixed top-0 left-0 w-full glass z-50">

<div class="max-w-7xl mx-auto px-6">

<div class="flex justify-between items-center h-20">

<div class="flex items-center gap-4">

<img src="logo.png"
class="w-14 h-14 rounded-full border border-white">

<div>

<h2 class="text-2xl font-bold">
Abdullah's Store
</h2>

<p class="text-gray-400 text-sm">
Premium Digital Marketplace
</p>

</div>

</div>

<ul class="hidden lg:flex gap-10">

<li><a href="index.html">Home</a></li>

<li><a href="courses.html">Courses</a></li>

<li><a href="reels.html">Reels</a></li>

<li><a href="packs.html">Packs</a></li>

</ul>

</div>

</div>

</nav>

<section class="pt-40 pb-20">

<div class="max-w-7xl mx-auto px-6">

<div class="text-center">

<p class="tracking-[8px] uppercase text-gray-500">

FREE AI TOOLS

</p>

<h1 class="text-6xl font-black mt-6">

Explore AI Tools

</h1>

<p class="text-gray-400 mt-6 max-w-3xl mx-auto">

Discover the best free AI tools for Image Generation, Video Creation,
Coding, Writing, Voice, Music and Productivity.

</p>

<input
id="search"
type="text"
placeholder="Search AI Tool..."
class="mt-10 w-full max-w-xl px-6 py-4 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-white">

</div>

<div id="toolBox"
class="grid md:grid-cols-2 lg:grid-cols-3 gap-8 mt-16">

<!-- JS -->

</div>

</div>

</section>
<script>

const tools = [

{icon:"🤖",category:"AI Chat Assistant",name:"ChatGPT",link:"https://chatgpt.com"},
{icon:"✨",category:"AI Chat Assistant",name:"Google Gemini",link:"https://gemini.google.com"},
{icon:"🧠",category:"AI Chat Assistant",name:"Claude AI",link:"https://claude.ai"},
{icon:"⚡",category:"AI Search Engine",name:"Perplexity AI",link:"https://www.perplexity.ai"},
{icon:"💻",category:"AI Coding",name:"DeepSeek",link:"https://chat.deepseek.com"},
{icon:"👨‍💻",category:"AI Coding",name:"Qwen Chat",link:"https://chat.qwen.ai"},
{icon:"🎨",category:"AI Image Generator",name:"Leonardo AI",link:"https://leonardo.ai"},
{icon:"🖼️",category:"AI Image Generator",name:"Ideogram",link:"https://ideogram.ai"},
{icon:"🔥",category:"AI Image Generator",name:"Adobe Firefly",link:"https://firefly.adobe.com"},
{icon:"🪄",category:"AI Image Editing",name:"Clipdrop",link:"https://clipdrop.co"},
{icon:"📸",category:"AI Photo Editing",name:"PhotoRoom",link:"https://www.photoroom.com"},
{icon:"🎬",category:"AI Video Generator",name:"Kling AI",link:"https://klingai.com"},
{icon:"🎥",category:"AI Video Generator",name:"PixVerse AI",link:"https://app.pixverse.ai"},
{icon:"🚀",category:"AI Video Generator",name:"Hailuo AI",link:"https://hailuoai.video"},
{icon:"🎙️",category:"AI Voice Generator",name:"ElevenLabs",link:"https://elevenlabs.io"},
{icon:"🎵",category:"AI Music Generator",name:"Suno AI",link:"https://suno.com"},
{icon:"🎼",category:"AI Music Generator",name:"Udio",link:"https://udio.com"},
{icon:"🎨",category:"AI Design",name:"Canva AI",link:"https://www.canva.com"},
{icon:"📝",category:"AI Writing",name:"Notion AI",link:"https://www.notion.so/product/ai"},
{icon:"📄",category:"AI Presentation",name:"Gamma AI",link:"https://gamma.app"}

];

const toolBox = document.getElementById("toolBox");
const search = document.getElementById("search");

function render(data){

toolBox.innerHTML="";

data.forEach(tool=>{

toolBox.innerHTML += `

<div class="glass rounded-3xl p-8 hover:-translate-y-3 duration-300 border border-white/10 hover:border-white">

<div class="text-5xl">${tool.icon}</div>

<p class="text-sm uppercase tracking-[3px] text-blue-400 mt-6">
${tool.category}
</p>

<h2 class="text-3xl font-bold mt-2">
${tool.name}
</h2>


<p class="text-gray-500 text-sm mt-4 break-all">
${tool.link}
</p>

<div class="grid grid-cols-2 gap-3 mt-8">

<a href="${tool.link}"
target="_blank"
class="bg-white text-black text-center py-3 rounded-xl font-semibold hover:scale-105 duration-300">

Open Tool

</a>

<a href="https://wa.me/923006234728?text=Feedback%20:"
target="_blank"
class="border border-white text-center py-3 rounded-xl font-semibold hover:bg-white hover:text-black duration-300">

Feedback

</a>

</div>

</div>

`;

});

}

render(tools);

search.addEventListener("input",()=>{

const value = search.value.toLowerCase();

const filtered = tools.filter(tool=>

tool.name.toLowerCase().includes(value) ||

tool.category.toLowerCase().includes(value)

);

render(filtered);

});

</script>

</body>
</html>
